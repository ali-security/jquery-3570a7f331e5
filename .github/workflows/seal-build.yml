name: seal-build

on:
  workflow_dispatch: {}

env:
  NPM_CONFIG_REGISTRY: https://:2014-05-01T18%3A05%3A32.863000Z@time-machines-npm.sealsecurity.io/

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '0.10'

      - name: Install faketime
        run: sudo apt-get update && sudo apt-get install -y faketime

      - name: Install dependencies
        run: |
          node --version
          npm --version
          npm install

      # `npm run build` is `npm install && grunt`; grunt runs under faketime at the
      # release minute so the @DATE header and the uglify banner year match the release.
      - name: Build (grunt)
        run: TZ=UTC faketime '2014-05-01 17:42:30' ./node_modules/.bin/grunt

      # build/release.js generateArtifacts(): grunt (already run) + makeReleaseCopies() -> dist/cdn
      - name: Generate dist/cdn release copies
        run: |
          npm install shelljs@0.2.6
          node -e '
            var Release = { newVersion: "1.11.1", preRelease: false, complete: function() {},
              exec: function() {}, define: function( o ) { Release.def = o; } };
            require( "./build/release.js" )( Release );
            Release.def.generateArtifacts( function( files ) { console.log( "release files:", files ); } );
          '
          ls -la dist dist/cdn

      - name: Pack
        run: npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: jquery-npm
          path: jquery-1.11.1.tgz
          if-no-files-found: error
